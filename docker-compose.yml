# Todo local (CLAUDE.md, invariante 12): Postgres de la app, Chatwoot y backend.
#
#   docker compose up -d --build --wait
#
# Puertos: backend :3000 · Chatwoot :3001 · Postgres de la app :5432 (otra demo aparte, con `npm run demo:todo -- --proyecto <nombre> --puerto <n>`, los cambia con DEMO_PUERTO, DEMO_PUERTO_CHATWOOT y DEMO_PUERTO_POSTGRES;
# ahí DEMO_IMAGEN le da su propia imagen para no retocar la de la demo principal). Publicados SOLO en 127.0.0.1 (K3, EB-20): la demo trae contraseñas públicas y no debe
# quedar al alcance de otra máquina de la red.
# Chatwoot trae su propio Postgres (con pgvector, que exige) y Redis; no comparte base con la app.
#
# Demo local (SPEC 0.5): al levantar, chatwoot-setup configura la cuenta, el asesor y el Agent
# Bot, y demo-preparar migra, siembra y crea la bandeja. Todo es idempotente y se reconstruye
# igual después de `docker compose down -v`. Credenciales de desarrollo: config/demo-local.env.

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  SECRET_KEY_BASE: solo-desarrollo-local-cambiar-en-produccion-0123456789abcdef
  # Ensayo con WhatsApp real (V9): Chatwoot pone este FRONTEND_URL en el `status_callback` de cada mensaje que manda por Twilio, así que en el ensayo tiene
  # que ser la URL pública del túnel (ORIGEN_PUBLICO de .env). Sin esa variable, es el de siempre.
  FRONTEND_URL: ${ORIGEN_PUBLICO:-http://localhost:${DEMO_PUERTO_CHATWOOT:-3001}}
  ENABLE_ACCOUNT_SIGNUP: "false"
  POSTGRES_HOST: chatwoot-postgres
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: chatwoot
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://chatwoot-redis:6379
  # Solo local: deja que los webhooks del bot lleguen al backend por la red interna.
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"

# Guarda local: el Chatwoot de desarrollo nunca debe poder alcanzar Twilio real, ni siquiera con
# credenciales falsas (PLAN-NOCHE: nada contra Twilio real). Los dominios resuelven a loopback.
#
# ENSAYO CON WHATSAPP REAL (V9, docs/ENSAYO-WHATSAPP-REAL.md). SOLO para el ensayo en la máquina de Eduardo, nunca en un despliegue real: con
# `ENSAYO_TWILIO_BLOQUEO_PREFIJO=apagado-` en .env, el bloqueo se pone sobre «apagado-api.twilio.com» (un nombre que nadie usa) y Chatwoot ve el
# verdadero. Es lo único que se relaja aquí: los cuatro dominios de Twilio dejan de apuntar a loopback. Sin la variable (lo normal) no cambia nada.
# El backend se niega a arrancar en un despliegue real si trae esa variable (src/seguridad/entorno.ts).
x-sin-twilio: &sin-twilio
  extra_hosts:
    - "${ENSAYO_TWILIO_BLOQUEO_PREFIJO:-}api.twilio.com:127.0.0.1"
    - "${ENSAYO_TWILIO_BLOQUEO_PREFIJO:-}messaging.twilio.com:127.0.0.1"
    - "${ENSAYO_TWILIO_BLOQUEO_PREFIJO:-}content.twilio.com:127.0.0.1"
    - "${ENSAYO_TWILIO_BLOQUEO_PREFIJO:-}media.twilio.com:127.0.0.1"
    - "host.docker.internal:host-gateway"

x-backend: &backend
  # Objetivo «demo» del Dockerfile: lleva la CLI de Prisma (demo-preparar migra y siembra con ella). La imagen de producción (objetivo «produccion») no la lleva.
  build:
    context: .
    target: demo
  image: ${DEMO_IMAGEN:-inscripciones-backend:local}
  env_file: config/demo-local.env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inscripciones
      POSTGRES_PASSWORD: inscripciones
      POSTGRES_DB: inscripciones
    ports:
      - "127.0.0.1:${DEMO_PUERTO_POSTGRES:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inscripciones -d inscripciones"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    environment:
      DATABASE_URL: postgresql://inscripciones:inscripciones@postgres:5432/inscripciones
      PORT: "3000"
      # API de la aplicación (B1). La demo corre en http://localhost: la cookie de sesión no puede ser
      # Secure (el backend arranca con NODE_ENV=production, que la haría Secure por defecto) y el
      # único origen que puede hacer peticiones que cambian algo es el propio backend.
      COOKIE_SEGURA: "false"
      # K3: la demo corre con NODE_ENV=production y valores públicos de demostración. Esta marca deja arrancar al backend (que en un despliegue real se
      # niega: src/seguridad/entorno.ts) y hace que lo diga en el log.
      ENTORNO_DEMO: "si"
      # K4: /metricas (formato Prometheus) con un token de demostración: curl -H "Authorization: Bearer $METRICAS_TOKEN" http://localhost:3000/metricas
      METRICAS_TOKEN: demo-local-metricas-token-0001-solo-demo
      # Ensayo con WhatsApp real (V9): ORIGEN_PUBLICO de .env es la URL https del túnel; entonces es también la URL con la que Twilio firma sus llamadas
      # (PUBLIC_BASE_URL) y el borde de Twilio se enciende con TWILIO_AUTH_TOKEN. Sin ellas (lo normal) todo queda apagado y la demo no cambia.
      ORIGEN_PUBLICO: ${ORIGEN_PUBLICO:-http://localhost:${DEMO_PUERTO:-3000}}
      PUBLIC_BASE_URL: ${ORIGEN_PUBLICO:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      ENSAYO_LOCAL: ${ENSAYO_LOCAL:-}
      # Interfaz web (J3): la ficha del lead arma el enlace a su conversación con esta URL pública de Chatwoot (la que abre el navegador).
      CHATWOOT_URL_PUBLICA: http://localhost:${DEMO_PUERTO_CHATWOOT:-3001}
      # IP real de los clientes (EB-04). En la demo el puerto 3000 se publica directamente (no hay balanceador):
      # ningún salto de confianza. Detrás de un balanceador de AWS (ALB) se pone `1`; con `false` explícito el
      # backend no avisa. Sin ningún valor y con NODE_ENV=production el backend loguea una alerta fuerte al arrancar.
      TRUST_PROXY: "false"
      # Clave de los datos de salud (B4). SOLO DEMO: está en el repositorio. En un ambiente real se genera
      # con `openssl rand -base64 32` y vive en el gestor de secretos.
      CLAVE_DATOS_SENSIBLES: "I4YAELLXaPYTGc2hPt5pVkQ8r0G5MpudNuv0u31Zp28="
    ports:
      - "127.0.0.1:${DEMO_PUERTO:-3000}:3000"
    # El cierre ordenado del backend (src/cierre.ts) espera hasta LIMITE_CIERRE_MS (30 s) a que termine
    # el barrido en curso; compose manda SIGKILL a los 10 s por defecto. Este plazo tiene que ser mayor
    # (un test lo comprueba).
    stop_grace_period: 45s
    # Arranca cuando la demo quedó preparada: así `up --wait` falla si la preparación falla.
    depends_on:
      postgres:
        condition: service_healthy
      demo-preparar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ENSAYO (V9): perfil `ensayo`. La ÚNICA puerta pública del ensayo. El túnel apunta aquí (127.0.0.1:3100), no al backend: deja pasar solo los POST de
  # Twilio (/webhooks/twilio/entrantes, /estados, /diagnostico y /twilio/delivery_status) y el GET /salud; todo lo demás (la interfaz, /api con las contraseñas
  # públicas de la demo, /metricas, Chatwoot) da 404. Sin el perfil no existe.
  #   docker compose --profile ensayo up -d --wait
  ensayo-borde:
    profiles: ["ensayo"]
    build:
      context: .
      target: demo
    image: ${DEMO_IMAGEN:-inscripciones-backend:local}
    command: ["node", "scripts/ensayo-borde.ts"]
    environment:
      PORT: "3100"
      DESTINO: http://backend:3000
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DB: chatwoot
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-redis:
    image: redis:7-alpine
    volumes:
      - chatwoot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea o migra la base de Chatwoot y termina. Los servicios de Chatwoot esperan a que acabe.
  chatwoot-prepare:
    image: chatwoot/chatwoot:v4.18.0
    environment: *chatwoot-env
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    restart: "no"

  chatwoot:
    image: chatwoot/chatwoot:v4.18.0
    <<: *sin-twilio
    environment: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:${DEMO_PUERTO_CHATWOOT:-3001}:3000"
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.18.0
    <<: *sin-twilio
    environment: *chatwoot-env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully

  # Demo: cuenta, asesor y Agent Bot en Chatwoot (chatwoot/setup.rb). Corre y termina.
  chatwoot-setup:
    image: chatwoot/chatwoot:v4.18.0
    env_file: config/demo-local.env
    environment: *chatwoot-env
    volumes:
      - ./chatwoot/setup.rb:/setup/setup.rb:ro
    command: ["bundle", "exec", "rails", "runner", "/setup/setup.rb"]
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    restart: "no"

  # Demo: migraciones, seed y bandeja de Chatwoot conectada al bot. Corre y termina.
  demo-preparar:
    <<: *backend
    environment:
      DATABASE_URL: postgresql://inscripciones:inscripciones@postgres:5432/inscripciones
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx prisma db execute --file prisma/seed/demo.sql && npx prisma db execute --file prisma/seed/catalogo.sql && npx prisma db execute --file prisma/seed/catalogo-completo.sql && npx prisma db execute --file prisma/seed/clase-muestra.sql && npx prisma db execute --file prisma/seed/seguimiento.sql && npx prisma db execute --file prisma/seed/progresion.sql && node scripts/preparar-chatwoot.ts
    depends_on:
      postgres:
        condition: service_healthy
      chatwoot:
        condition: service_healthy
      chatwoot-setup:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
  chatwoot-postgres-data:
  chatwoot-redis-data:
