# Todo local (CLAUDE.md, invariante 12): Postgres de la app, Chatwoot y backend.
#
#   docker compose up -d --build
#
# Puertos: backend :3000 · Chatwoot :3001 · Postgres de la app :5432.
# Chatwoot trae su propio Postgres (con pgvector, que exige) y Redis; no comparte base con la app.

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  SECRET_KEY_BASE: solo-desarrollo-local-cambiar-en-produccion-0123456789abcdef
  FRONTEND_URL: http://localhost:3001
  ENABLE_ACCOUNT_SIGNUP: "false"
  POSTGRES_HOST: chatwoot-postgres
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: chatwoot
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://chatwoot-redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inscripciones
      POSTGRES_PASSWORD: inscripciones
      POSTGRES_DB: inscripciones
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inscripciones -d inscripciones"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://inscripciones:inscripciones@postgres:5432/inscripciones
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DB: chatwoot
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-redis:
    image: redis:7-alpine
    volumes:
      - chatwoot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea o migra la base de Chatwoot y termina. Los servicios de Chatwoot esperan a que acabe.
  chatwoot-prepare:
    image: chatwoot/chatwoot:v4.18.0
    environment: *chatwoot-env
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    restart: "no"

  chatwoot:
    image: chatwoot/chatwoot:v4.18.0
    environment: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "3001:3000"
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.18.0
    environment: *chatwoot-env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully

volumes:
  postgres-data:
  chatwoot-postgres-data:
  chatwoot-redis-data:
