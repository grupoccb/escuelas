<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F3F4F8}
*,*::before,*::after{box-sizing:border-box}
a{color:#2B2699;text-decoration:none}a:hover{color:#171A2C}
</style>
</helmet>
<div style="min-height: 100vh; padding: clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px; background: #F3F4F8; color: #171A2C; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 22px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 760px">
<div style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #3A32D1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">AN</span><span style="font-weight: 700; font-size: 17px">Academia Nova · prototipo</span></div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(32px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.02em">Todas las pantallas</h1>
<p style="margin: 0; color: #454B60">Cada pantalla funciona sola y se adapta a celular. Los diálogos y estados viven dentro de su pantalla; los que son solo de estado se cambian desde Tweaks.</p>
</div>
<a href="En-celular.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 18px; background: #171A2C; color: #FFFFFF; border-radius: 12px; font-weight: 700">Ver las 4 principales en celular</a>
</header>
<sc-for list="{{ grupos }}" as="g" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6074">{{ g.titulo }}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px">
<sc-for list="{{ g.items }}" as="i" hint-placeholder-count="4">
<a href="{{ i.href }}" style="display: flex; flex-direction: column; gap: 6px; padding: 16px; background: #FFFFFF; border: 1px solid #DEE1EA; border-radius: 14px; color: #171A2C" style-hover="border-color: #8E95AA; box-shadow: 0 10px 24px -14px rgba(23,26,44,0.35)">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><strong style="font-size: 16px">{{ i.nombre }}</strong><sc-if value="{{ i.nueva }}"><span style="padding: 2px 8px; background: #ECEBFC; color: #2B2699; border-radius: 999px; font-size: 12px; font-weight: 700">Más trabajada</span></sc-if></span>
<span style="color: #5A6074; font-size: 14px; line-height: 20px; text-wrap: pretty">{{ i.detalle }}</span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  G = [
    ['Acceso y cuenta', [['Acceso', 'Acceso.dc.html', 'Inicio de sesión. Errores 401, 429 y sin conexión en Tweaks.'], ['Mi cuenta', 'Mas.dc.html', 'Secciones, salir y cambiar mi contraseña con validación.'], ['Estados', 'Estados.dc.html', 'Sin acceso, módulo apagado, 404, error de carga, abriendo, vacío.']]],
    ['Asesor · captación', [['Embudo', 'Embudo.dc.html', 'Arrastrar y soltar, selección en lote, ficha lateral, perdido → motivo, inscrito → inscripción.', true], ['Tareas', 'Tareas.dc.html', 'Pendientes y resueltas por tipo; resolver o descartar con nota.'], ['Ficha del lead', 'Ficha-lead.dc.html', 'Avance en el embudo, niños, cotizar, clases muestra e historial.'], ['Inscripción', 'Conversion.dc.html', 'Cuatro pasos: familia, alumnos, grupos con lugares reales y confirmar.'], ['Página de captación', 'Pagina-captacion.dc.html', 'La página pública que llena la familia y salta a WhatsApp.']]],
    ['Maestro', [['Hoy', 'Hoy-maestro.dc.html', 'Línea del día con la hora actual; asistencia y «listo para cerrar».', true], ['Pase de lista', 'Pase-de-lista.dc.html', 'Presente, falta o justificada con un toque; un solo guardado.'], ['Registro del alumno', 'Registro-alumno.dc.html', 'Seis secciones con avance, salud protegida y reglamento.']]],
    ['Recepción · cobranza', [['Registrar pago', 'Registrar-pago.dc.html', 'El reparto se ve en cada cargo al escribir el monto.', true], ['Estado de cuenta', 'Estado-de-cuenta.dc.html', 'Saldo, vencido, cargos por hijo y cancelar un pago con motivo.'], ['Uniformes', 'Uniformes.dc.html', 'Por entregar y entregados, con existencia.'], ['Ventas', 'Ventas.dc.html', 'Productos con existencia, vender y anular.'], ['Cierre del día', 'Cierre-del-dia.dc.html', 'Efectivo para contar, por forma de pago y por persona.']]],
    ['Escuela', [['Tableros', 'Tableros.dc.html', 'La historia del mes en 8 secciones con filtros.', true], ['Alumnos', 'Alumnos.dc.html', 'Por disciplina, con asistencia y saldo.'], ['Expediente', 'Expediente.dc.html', 'Trayectoria, asistencia, económico, comercial, salud; cambiar de grupo y baja.'], ['Familias', 'Familias.dc.html', 'Todas y las de un solo hijo inscrito.'], ['Ficha de la familia', 'Ficha-familia.dc.html', 'Hijos, adultos con sus banderas, saldo y mensajes.']]],
    ['Administración', [['Inicio', 'Administracion.dc.html', '«Para empezar» con los 8 pasos y buscador de áreas.'], ['Catálogo', 'Admin-catalogo.dc.html', '12 áreas: disciplinas, sucursales, programas, grupos, instructores y salones, promociones, canales, campañas, etapas, motivos, plantillas y usuarios.'], ['Sistema', 'Admin-sistema.dc.html', 'Módulos, configuración, automatizaciones, textos del asistente y bandeja.'], ['Precios', 'Precios.dc.html', 'Historial de vigencias y nueva vigencia.'], ['Cargar catálogo', 'Cargar-catalogo.dc.html', 'Plantillas, archivos, revisión con errores por fila y aplicar.']]],
  ];
  renderVals() {
    return { grupos: this.G.map(([titulo, items]) => ({ titulo, items: items.map(([nombre, href, detalle, nueva]) => ({ nombre, href, detalle, nueva: !!nueva })) })) };
  }
}
</script>
</body>
</html>
