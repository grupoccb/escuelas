<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Secciones" style="width: 232px; height: 100%; box-sizing: border-box; overflow-y: auto; scrollbar-width: none; background: #171A2C; color: #C9CDE0; display: flex; flex-direction: column; gap: 14px; padding: 16px 14px; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<div aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #3A32D1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">AN</div>
<div style="min-width: 0; color: #FFFFFF; font-weight: 700; font-size: 15px; line-height: 20px">Academia Nova</div>
</div>
<div style="padding: 0 6px">
<label for="sucursal-lateral" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Sucursal</label>
<select id="sucursal-lateral" value="{{ sucursal }}" onChange="{{ alSucursal }}" style="width: 100%; min-height: 44px; padding: 0 12px; background: transparent; color: #C9CDE0; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; font: inherit; font-size: 12.5px; cursor: pointer">
<option value="" style="color: #171A2C; background: #FFFFFF">Todas mis sucursales</option>
<option value="Águilas" style="color: #171A2C; background: #FFFFFF">Águilas</option>
<option value="Norte" style="color: #171A2C; background: #FFFFFF">Norte</option>
</select>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{ grupos }}" as="g" hint-placeholder-count="4">
<div style="padding: {{ g.relleno }}; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #A9AEC6">{{ g.titulo }}</div>
<sc-for list="{{ g.secciones }}" as="s" hint-placeholder-count="3">
<a href="{{ s.href }}" aria-current="{{ s.actual }}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: {{ s.fondo }}; color: {{ s.tinta }}; font-weight: {{ s.peso }}; text-decoration: none" style-hover="background: rgba(255,255,255,0.14); color: #FFFFFF"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ s.d }}"></path></svg>{{ s.nombre }}</a>
</sc-for>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 4px; padding: 10px 0 0 6px; border-top: 1px solid rgba(255,255,255,0.14)">
<a href="Mas.dc.html" aria-label="Mi cuenta (Adela Ramírez)" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px; color: #FFFFFF; font-weight: 600; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 999px; background: #2B3050; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">AR</span>
<span style="min-width: 0; display: flex; flex-direction: column"><span>Adela Ramírez</span><span style="color: #A9AEC6; font-size: 12.5px; line-height: 16px; font-weight: 500">Administración</span></span>
</a>
<a href="Acceso.dc.html" aria-label="Salir" title="Salir" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #A9AEC6" style-hover="background: rgba(255,255,255,0.14); color: #FFFFFF"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5H5.5a1 1 0 00-1 1v11a1 1 0 001 1H8M12.5 6.5L16 10l-3.5 3.5M16 10H8"></path></svg></a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activa&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hoy&quot;,&quot;pase&quot;,&quot;embudo&quot;,&quot;tareas&quot;,&quot;pagos&quot;,&quot;cuenta&quot;,&quot;uniformes&quot;,&quot;ventas&quot;,&quot;corte&quot;,&quot;tableros&quot;,&quot;alumnos&quot;,&quot;familias&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sucursal&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;alSucursal&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e: Event) =&gt; void&quot;},&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { suc: '' };
  GRUPOS = [
    ['Clases', [['hoy', 'Hoy', 'Hoy-maestro.dc.html'], ['pase', 'Pase de lista', 'Pase-de-lista.dc.html']]],
    ['Captación', [['embudo', 'Embudo', 'Embudo.dc.html'], ['tareas', 'Tareas', 'Tareas.dc.html']]],
    ['Cobranza', [['pagos', 'Registrar pago', 'Registrar-pago.dc.html'], ['cuenta', 'Estado de cuenta', 'Estado-de-cuenta.dc.html'], ['uniformes', 'Uniformes', 'Uniformes.dc.html'], ['ventas', 'Ventas', 'Ventas.dc.html'], ['corte', 'Cierre del día', 'Cierre-del-dia.dc.html']]],
    ['Escuela', [['tableros', 'Tableros', 'Tableros.dc.html'], ['alumnos', 'Alumnos', 'Alumnos.dc.html'], ['familias', 'Familias', 'Familias.dc.html'], ['admin', 'Administración', 'Administracion.dc.html']]],
  ];
  ICONOS = {
    hoy: 'M5 4h10a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z M3 8h14M7 2.5v3M13 2.5v3',
    pase: 'M3.5 5.5L5 7l2.5-3M3.5 11.5L5 13l2.5-3M10.5 6h6M10.5 12h6M10.5 16.5h6',
    embudo: 'M3 4h14l-5.5 6.5V16l-3-1.5v-4L3 4z',
    tareas: 'M6 3h8a3 3 0 013 3v8a3 3 0 01-3 3H6a3 3 0 01-3-3V6a3 3 0 013-3z M6.5 10l2.5 2.5 4.5-5',
    pagos: 'M4.5 4.5h11a2 2 0 012 2v7a2 2 0 01-2 2h-11a2 2 0 01-2-2v-7a2 2 0 012-2z M2.5 8.5h15M5.5 12.5h3',
    cuenta: 'M5 2.5h10v15l-2.5-1.5L10 17.5 7.5 16 5 17.5v-15z M8 7h4M8 10.5h4',
    uniformes: 'M7 3L3 5.5l1.5 3L6.5 8v9h7V8l2 .5 1.5-3L13 3c-.4 1.3-1.5 2-3 2s-2.6-.7-3-2z',
    ventas: 'M2.5 3.5h2l2 9h8.5l1.5-6H6 M7.5 16.7a.7.7 0 100-1.4.7.7 0 000 1.4zM14 16.7a.7.7 0 100-1.4.7.7 0 000 1.4z',
    corte: 'M6 2.5h8a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2v-11a2 2 0 012-2z M7 6.5h6M7 10h6M7 13.5h3',
    tableros: 'M3 17h14M6 14V9M10 14V5M14 14v-3',
    alumnos: 'M7.5 10a3 3 0 100-6 3 3 0 000 6z M2.5 16.5c.6-2.8 2.5-4.2 5-4.2s4.4 1.4 5 4.2 M13 4.3a3 3 0 010 5.4M15 12.6c1.4.6 2.2 1.9 2.5 3.9',
    familias: 'M3 9.5L10 3l7 6.5 M5 8.5V17h10V8.5 M8.5 17v-4.5h3V17',
    admin: 'M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z M16.2 10l1.3.8-1.3 2.2-1.5-.4a5.5 5.5 0 01-1.3.8l-.4 1.6H10.3l-.4-1.6a5.5 5.5 0 01-1.3-.8l-1.5.4-1.3-2.2L7 10a5.6 5.6 0 010-1.6l-1.3-.8 1.3-2.2 1.5.4a5.5 5.5 0 011.3-.8l.4-1.6h2.4l.4 1.6a5.5 5.5 0 011.3.8l1.5-.4 1.3 2.2-1.3.8c.1.5.1 1.1 0 1.6z',
  };
  renderVals() {
    const activa = this.props.activa || '';
    return {
      sucursal: this.props.sucursal ?? this.state.suc,
      alSucursal: (e) => { if (this.props.alSucursal) this.props.alSucursal(e); else this.setState({ suc: e.target.value }); },
      grupos: this.GRUPOS.map(([titulo, secs], i) => ({ titulo, relleno: i ? '14px 12px 4px' : '6px 12px 4px', secciones: secs.map(([id, nombre, href]) => { const a = id === activa; return { nombre, href, d: this.ICONOS[id], actual: a ? 'page' : undefined, fondo: a ? 'rgba(255,255,255,0.12)' : 'transparent', tinta: a ? '#FFFFFF' : '#C9CDE0', peso: a ? 700 : 500 }; }) })),
    };
  }
}
</script>
</body>
</html>
