<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F3F4F8}
*,*::before,*::after{box-sizing:border-box}
a{color:#2B2699;text-decoration:none}a:hover{color:#171A2C}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid #3A32D1;outline-offset:2px}
</style>
</helmet>
<div ref="{{ raiz }}" style="position: relative; height: 100vh; max-height: 100%; display: flex; flex-direction: {{ direccion }}; overflow: hidden; background: #F3F4F8; color: #171A2C; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<sc-if value="{{ escritorio }}" hint-placeholder-val="{{ true }}"><dc-import name="Lateral" activa="alumnos" hint-size="232px,100%" style="flex: 0 0 232px; height: 100%"></dc-import></sc-if>
<div style="flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column">
<sc-if value="{{ movil }}"><dc-import name="Cabecera" hint-size="100%,60px"></dc-import></sc-if>
<main style="flex: 1 1 auto; min-height: 0; overflow: auto; padding: {{ relleno }}; display: flex; flex-direction: column; gap: 16px">
<div style="flex: none; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 16px">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 38px; letter-spacing: -0.015em">Alumnos</h1>
<div style="color: #5A6074">{{ subtitulo }}</div>
</div>
<label style="flex: 1 1 260px; max-width: 360px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: #FFFFFF; border: 1px solid #8E95AA; border-radius: 10px; color: #5A6074"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14.5a5.5 5.5 0 100-11 5.5 5.5 0 000 11z M13.5 13.5L17 17"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar alumno</span><input type="search" value="{{ q }}" onChange="{{ alQ }}" placeholder="Buscar alumno o familia" style="flex: 1; min-width: 0; min-height: 42px; border: 0; outline: 0; background: transparent; color: #171A2C; font-size: 14px"></label>
</div>
<div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{ c.activo }}" onClick="{{ c.alElegir }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ c.borde }}; background: {{ c.fondo }}; color: {{ c.tinta }}; font-weight: 600; cursor: pointer"><sc-if value="{{ c.hayPunto }}"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 999px; background: {{ c.punto }}; box-shadow: 0 0 0 2px {{ c.anillo }}"></span></sc-if>{{ c.nombre }}</button></sc-for>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; margin-left: 6px; font-weight: 500; cursor: pointer"><input type="checkbox" checked="{{ soloAtraso }}" onChange="{{ alAtraso }}" style="width: 20px; height: 20px; margin: 0; accent-color: #3A32D1">Solo con atraso o faltas</label>
</div>
<div style="flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px">
<sc-for list="{{ alumnos }}" as="a" hint-placeholder-count="9">
<a href="Expediente.dc.html" style="background: #FFFFFF; border: 1px solid #DEE1EA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; color: #171A2C" style-hover="border-color: #8E95AA; box-shadow: 0 10px 24px -14px rgba(23,26,44,0.35)">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{ a.suave }}; color: {{ a.tinta }}; font-weight: 700; font-size: 14px">{{ a.iniciales }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px; line-height: 22px">{{ a.nombre }}</span><span style="color: #5A6074; font-size: 13px">{{ a.edad }} · familia {{ a.familia }}</span></span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; background: {{ a.suave }}; color: {{ a.tinta }}; font-size: 12px; line-height: 16px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: {{ a.color }}"></span>{{ a.grupo }}</span><span style="padding: 2px 8px; background: #ECEDF3; color: #3A3F52; border-radius: 6px; font-size: 12px; line-height: 16px; font-weight: 600">{{ a.sucursal }}</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="display: flex; align-items: center; gap: 8px; color: #454B60; font-size: 13px"><span aria-hidden="true" style="width: 64px; height: 6px; border-radius: 3px; background: #E7E9F1; overflow: hidden"><span style="display: block; height: 100%; width: {{ a.asistencia }}; background: {{ a.colorAsis }}"></span></span>{{ a.asistencia }} asistencia</span>
<span style="padding: 2px 9px; border-radius: 999px; background: {{ a.fondoSaldo }}; color: {{ a.tintaSaldo }}; font-size: 12px; line-height: 16px; font-weight: 700">{{ a.saldo }}</span>
</div>
</a>
</sc-for>
</div>
<sc-if value="{{ vacio }}"><div style="padding: 16px; background: #FFFFFF; border: 1px solid #DEE1EA; border-radius: 12px; color: #5A6074">Ningún alumno coincide con estos filtros. Borra la búsqueda o elige «Todas».</div></sc-if>
</main>
<sc-if value="{{ movil }}"><dc-import name="Barra" rol="admin" activa="alumnos" hint-size="100%,72px"></dc-import></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  raiz = React.createRef();
  D = { karate: ['Karate', 'oklch(0.6 0.16 35)', 'oklch(0.95 0.035 35)', 'oklch(0.44 0.13 35)'], ballet: ['Ballet clásico', 'oklch(0.6 0.16 355)', 'oklch(0.95 0.035 355)', 'oklch(0.44 0.13 355)'], salsa: ['Salsa', 'oklch(0.6 0.11 190)', 'oklch(0.95 0.03 190)', 'oklch(0.42 0.08 190)'] };
  DATOS = [['Santino Vivanco', 4, 'Vivanco', 'karate', 'Karate Infantil 3-5', 'Águilas', 62, 'vencido'], ['Valentina Vivanco', 7, 'Vivanco', 'ballet', 'Ballet Infantil 5-8', 'Águilas', 94, 'pendiente'], ['Diego Núñez', 11, 'Núñez', 'karate', 'Karate Infantil 9-12', 'Norte', 71, 'vencido'], ['Martina Salinas', 9, 'Salinas', 'ballet', 'Ballet Infantil 9-12', 'Norte', 97, 'ok'], ['Nicolás Ibáñez', 7, 'Ibáñez', 'karate', 'Karate Infantil 6-8', 'Águilas', 100, 'ok'], ['Carlota Ramos', 6, 'Ramos', 'ballet', 'Ballet Infantil 5-8', 'Norte', 89, 'ok'], ['Rosa Delgado', null, 'Delgado', 'salsa', 'Salsa Adultos Principiantes', 'Águilas', 83, 'ok'], ['Ivana Mejía', 8, 'Mejía', 'ballet', 'Ballet Infantil 5-8', 'Norte', 92, 'pendiente'], ['Emiliano Medina', 11, 'Medina', 'karate', 'Karate Infantil 9-12', 'Norte', 88, 'ok'], ['Andrea Carranza', 5, 'Carranza', 'karate', 'Karate Infantil 3-5', 'Águilas', 96, 'ok'], ['Jorge Treviño', null, 'Treviño', 'salsa', 'Salsa Intermedios', 'Norte', 75, 'ok'], ['Regina Olvera', 5, 'Olvera', 'ballet', 'Ballet Infantil 5-8', 'Águilas', 91, 'ok']];
  state = { movil: false, q: '', disc: '', atraso: false };
  componentDidMount() { const el = this.raiz.current; if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => this.medir()); this.ro.observe(el); } this.medir(); }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  medir() { const el = this.raiz.current; if (!el) return; const movil = el.offsetWidth < 900; if (movil !== this.state.movil) this.setState({ movil }); }
  renderVals() {
    const s = this.state, movil = s.movil, q = s.q.trim().toLowerCase();
    const sal = { vencido: ['Con vencido', '#FFF0D2', '#6B4100'], pendiente: ['Por pagar', '#ECEDF3', '#3A3F52'], ok: ['Al corriente', '#E1F3E7', '#17603A'] };
    const lista = this.DATOS.filter(([n, , f, d, , , as, sa]) => (!s.disc || d === s.disc) && (!q || `${n} ${f}`.toLowerCase().includes(q)) && (!s.atraso || sa === 'vencido' || as < 75)).map(([nombre, e, familia, d, grupo, sucursal, as, sa]) => { const p = nombre.split(' '), [, color, suave, tinta] = this.D[d]; return { nombre, iniciales: p[0][0] + p[1][0], edad: e ? `${e} años` : 'adulto', familia, grupo, sucursal, color, suave, tinta, asistencia: as + '%', colorAsis: as < 75 ? '#D9962B' : '#17603A', saldo: sal[sa][0], fondoSaldo: sal[sa][1], tintaSaldo: sal[sa][2] }; });
    const est = (a) => (a ? { fondo: '#171A2C', tinta: '#FFFFFF', borde: '#171A2C', anillo: '#171A2C' } : { fondo: '#FFFFFF', tinta: '#171A2C', borde: '#C5CAD8', anillo: '#FFFFFF' });
    return {
      raiz: this.raiz, escritorio: !movil, movil, direccion: movil ? 'column' : 'row', relleno: movil ? '8px 16px 24px' : '28px 32px 32px',
      subtitulo: '312 alumnos activos en 326 inscripciones · se muestran los de este mes con movimiento',
      q: s.q, alQ: (e) => this.setState({ q: e.target.value }), soloAtraso: s.atraso, alAtraso: (e) => this.setState({ atraso: e.target.checked }),
      chips: [['', 'Todas']].concat(Object.keys(this.D).map((k) => [k, this.D[k][0], this.D[k][1]])).map(([id, nombre, punto]) => ({ nombre, punto, hayPunto: !!id, activo: s.disc === id, ...est(s.disc === id), alElegir: () => this.setState({ disc: id }) })),
      alumnos: lista, vacio: lista.length === 0,
    };
  }
}
</script>
</body>
</html>
