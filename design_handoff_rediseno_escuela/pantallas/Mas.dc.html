<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F3F4F8}
*,*::before,*::after{box-sizing:border-box}
a{color:#2B2699;text-decoration:none}a:hover{color:#171A2C}
button,input{font:inherit}
:focus-visible{outline:2px solid #3A32D1;outline-offset:2px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes velo{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div ref="{{ raiz }}" style="position: relative; height: 100vh; max-height: 100%; display: flex; flex-direction: {{ direccion }}; overflow: hidden; background: #F3F4F8; color: #171A2C; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 22px">
<sc-if value="{{ escritorio }}" hint-placeholder-val="{{ true }}"><dc-import name="Lateral" activa="" hint-size="232px,100%" style="flex: 0 0 232px; height: 100%"></dc-import></sc-if>
<div style="flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column">
<sc-if value="{{ movil }}"><dc-import name="Cabecera" hint-size="100%,60px"></dc-import></sc-if>
<main style="flex: 1 1 auto; min-height: 0; overflow: auto; padding: {{ relleno }}; display: flex; justify-content: center">
<div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 38px">Mi cuenta</h1>
<section style="display: flex; align-items: center; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #DEE1EA; border-radius: 16px"><span aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: #171A2C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">AR</span><div style="min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 18px">Adela Ramírez</strong><span style="color: #5A6074">adela@academianova.mx · Administración · todas las sucursales</span></div></section>
<section style="background: #FFFFFF; border: 1px solid #DEE1EA; border-radius: 16px; padding: 6px 16px">
<sc-for list="{{ secciones }}" as="s" hint-placeholder-count="8"><a href="{{ s.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #DEE1EA; color: #171A2C; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ s.d }}"></path></svg><span style="flex: 1">{{ s.nombre }}</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color: #5A6074"><path d="M4 10h11M11 5.5l4.5 4.5-4.5 4.5"></path></svg></a></sc-for>
</section>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{ alAbrir }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; background: #FFFFFF; color: #171A2C; border: 1px solid #C5CAD8; border-radius: 12px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15.7a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z M9.8 10.2L16.5 3.5M14 6l2 2M12 8l1.5 1.5"></path></svg>Cambiar mi contraseña</button>
<a href="Acceso.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; background: #FFFFFF; color: #B3261E; border: 1px solid #B3261E; border-radius: 12px; font-weight: 700"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5H5.5a1 1 0 00-1 1v11a1 1 0 001 1H8 M12.5 6.5L16 10l-3.5 3.5M16 10H8"></path></svg>Salir</a>
</div>
</div>
</main>
<sc-if value="{{ movil }}"><dc-import name="Barra" rol="admin" activa="mas" hint-size="100%,72px"></dc-import></sc-if>
</div>
<sc-if value="{{ abierto }}">
<div style="position: absolute; inset: 0; z-index: 60; display: flex; align-items: {{ dlgAlinear }}; justify-content: center; padding: {{ dlgRelleno }}; background: rgba(23,26,44,0.6); animation: velo 180ms cubic-bezier(.2,.8,.2,1)">
<div role="dialog" aria-modal="true" aria-labelledby="dlg-titulo" style="width: {{ dlgAncho }}; max-width: 100%; background: #FFFFFF; border-radius: {{ dlgRadio }}; box-shadow: 0 12px 32px rgba(23,26,44,0.18); animation: aparece 180ms cubic-bezier(.2,.8,.2,1)">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><h2 id="dlg-titulo" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Cambiar mi contraseña</h2>
<sc-for list="{{ campos }}" as="c" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px"><label for="{{ c.id }}" style="font-size: 12.5px; font-weight: 600; color: #5A6074">{{ c.etiqueta }}</label><input id="{{ c.id }}" type="password" value="{{ c.valor }}" onChange="{{ c.alCambiar }}" style="width: 100%; min-height: 48px; padding: 0 12px; background: #FFFFFF; border: {{ c.borde }}; border-radius: 10px; font-size: 16px"><sc-if value="{{ c.hayError }}"><span style="color: #B3261E; font-size: 12.5px; font-weight: 600">{{ c.error }}</span></sc-if><sc-if value="{{ c.hayAyuda }}"><span style="color: #5A6074; font-size: 12.5px">{{ c.ayuda }}</span></sc-if></div></sc-for>
</div>
<div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-top: 1px solid #DEE1EA"><button type="button" onClick="{{ alGuardar }}" style="min-height: 48px; padding: 0 20px; background: #3A32D1; color: #FFFFFF; border: 0; border-radius: 12px; font-weight: 700; cursor: pointer">Cambiar contraseña</button><button type="button" onClick="{{ alCerrar }}" style="min-height: 48px; padding: 0 18px; background: #FFFFFF; color: #171A2C; border: 1px solid #C5CAD8; border-radius: 12px; font-weight: 600; cursor: pointer">Cancelar</button></div>
</div>
</div>
</sc-if>
<sc-if value="{{ hayToast }}"><div role="status" style="position: absolute; left: 50%; bottom: {{ toastAbajo }}; z-index: 90; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; background: #171A2C; color: #FFFFFF; border-radius: 12px; box-shadow: 0 12px 32px rgba(23,26,44,0.28)"><span>Ya quedó: tu contraseña cambió.</span><button type="button" onClick="{{ alCerrarToast }}" style="flex: none; min-height: 40px; padding: 0 12px; background: #ECEBFC; color: #2B2699; border: 0; border-radius: 9px; font-weight: 700; cursor: pointer">Entendido</button></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  raiz = React.createRef();
  state = { movil: false, abierto: false, v: { actual: '', nueva: '', repetir: '' }, intento: false, toast: false };
  SEC = [['Registrar pago', 'Registrar-pago.dc.html', 'M4.5 4.5h11a2 2 0 012 2v7a2 2 0 01-2 2h-11a2 2 0 01-2-2v-7a2 2 0 012-2z M2.5 8.5h15M5.5 12.5h3'], ['Estado de cuenta', 'Estado-de-cuenta.dc.html', 'M5 2.5h10v15l-2.5-1.5L10 17.5 7.5 16 5 17.5v-15z M8 7h4M8 10.5h4'], ['Uniformes', 'Uniformes.dc.html', 'M7 3L3 5.5l1.5 3L6.5 8v9h7V8l2 .5 1.5-3L13 3c-.4 1.3-1.5 2-3 2s-2.6-.7-3-2z'], ['Ventas', 'Ventas.dc.html', 'M2.5 3.5h2l2 9h8.5l1.5-6H6 M7.5 16.7a.7.7 0 100-1.4.7.7 0 000 1.4zM14 16.7a.7.7 0 100-1.4.7.7 0 000 1.4z'], ['Cierre del día', 'Cierre-del-dia.dc.html', 'M6 2.5h8a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2v-11a2 2 0 012-2z M7 6.5h6M7 10h6M7 13.5h3'], ['Tableros', 'Tableros.dc.html', 'M3 17h14M6 14V9M10 14V5M14 14v-3'], ['Alumnos', 'Alumnos.dc.html', 'M7.5 10a3 3 0 100-6 3 3 0 000 6z M2.5 16.5c.6-2.8 2.5-4.2 5-4.2s4.4 1.4 5 4.2'], ['Familias', 'Familias.dc.html', 'M3 9.5L10 3l7 6.5 M5 8.5V17h10V8.5 M8.5 17v-4.5h3V17'], ['Administración', 'Administracion.dc.html', 'M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z']];
  componentDidMount() { const el = this.raiz.current; if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => this.medir()); this.ro.observe(el); } this.medir(); }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); clearTimeout(this.tt); }
  medir() { const el = this.raiz.current; if (!el) return; const movil = el.offsetWidth < 900; if (movil !== this.state.movil) this.setState({ movil }); }
  renderVals() {
    const s = this.state, movil = s.movil, v = s.v;
    const err = { actual: !v.actual ? 'Escribe tu contraseña actual.' : '', nueva: v.nueva.length < 10 ? 'La nueva necesita al menos 10 caracteres.' : '', repetir: v.repetir !== v.nueva || !v.repetir ? 'No coincide con la nueva.' : '' };
    return {
      raiz: this.raiz, escritorio: !movil, movil, direccion: movil ? 'column' : 'row', relleno: movil ? '8px 16px 24px' : '28px 32px 32px',
      secciones: this.SEC.map(([nombre, href, d]) => ({ nombre, href, d })), abierto: s.abierto, alAbrir: () => this.setState({ abierto: true, intento: false, v: { actual: '', nueva: '', repetir: '' } }), alCerrar: () => this.setState({ abierto: false }),
      campos: [['actual', 'Contraseña actual', ''], ['nueva', 'Nueva contraseña', 'Al menos 10 caracteres.'], ['repetir', 'Repite la nueva', '']].map(([k, etiqueta, ayuda]) => ({ id: 'c-' + k, etiqueta, valor: v[k], borde: s.intento && err[k] ? '2px solid #B3261E' : '1px solid #8E95AA', hayError: s.intento && !!err[k], error: err[k], hayAyuda: !!ayuda && !(s.intento && err[k]), ayuda, alCambiar: (e) => { const x = e.target.value; this.setState((st) => ({ v: { ...st.v, [k]: x } })); } })),
      alGuardar: () => { if (err.actual || err.nueva || err.repetir) return this.setState({ intento: true }); this.setState({ abierto: false, toast: true }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: false }), 4500); },
      hayToast: s.toast, alCerrarToast: () => this.setState({ toast: false }), toastAbajo: movil ? '84px' : '24px',
      dlgAlinear: movil ? 'flex-end' : 'center', dlgRelleno: movil ? '0' : '24px', dlgAncho: movil ? '100%' : '460px', dlgRadio: movil ? '20px 20px 0 0' : '16px',
    };
  }
}
</script>
</body>
</html>
