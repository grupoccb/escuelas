<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Secciones" style="display: flex; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DEE1EA; padding: 4px 8px 8px; font-family: 'Figtree', system-ui, sans-serif">
<sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
<a href="{{ i.href }}" aria-current="{{ i.actual }}" style="flex: 1 1 0; min-width: 0; height: 60px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{ i.tinta }}; font-size: 12.5px; line-height: 16px; font-weight: {{ i.peso }}; text-align: center; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ i.d }}"></path></svg>{{ i.nombre }}</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rol&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;maestro&quot;,&quot;recepcion&quot;,&quot;asesor&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;activa&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hoy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:72}}">
class Component extends DCLogic {
  S = {
    hoy: ['Hoy', 'Hoy-maestro.dc.html', 'M5 4h10a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z M3 8h14M7 2.5v3M13 2.5v3'],
    pase: ['Pase de lista', 'Pase-de-lista.dc.html', 'M3.5 5.5L5 7l2.5-3M3.5 11.5L5 13l2.5-3M10.5 6h6M10.5 12h6M10.5 16.5h6'],
    embudo: ['Embudo', 'Embudo.dc.html', 'M3 4h14l-5.5 6.5V16l-3-1.5v-4L3 4z'],
    tareas: ['Tareas', 'Tareas.dc.html', 'M6 3h8a3 3 0 013 3v8a3 3 0 01-3 3H6a3 3 0 01-3-3V6a3 3 0 013-3z M6.5 10l2.5 2.5 4.5-5'],
    pagos: ['Registrar pago', 'Registrar-pago.dc.html', 'M4.5 4.5h11a2 2 0 012 2v7a2 2 0 01-2 2h-11a2 2 0 01-2-2v-7a2 2 0 012-2z M2.5 8.5h15M5.5 12.5h3'],
    cuenta: ['Estado de cuenta', 'Estado-de-cuenta.dc.html', 'M5 2.5h10v15l-2.5-1.5L10 17.5 7.5 16 5 17.5v-15z M8 7h4M8 10.5h4'],
    uniformes: ['Uniformes', 'Uniformes.dc.html', 'M7 3L3 5.5l1.5 3L6.5 8v9h7V8l2 .5 1.5-3L13 3c-.4 1.3-1.5 2-3 2s-2.6-.7-3-2z'],
    alumnos: ['Alumnos', 'Alumnos.dc.html', 'M7.5 10a3 3 0 100-6 3 3 0 000 6z M2.5 16.5c.6-2.8 2.5-4.2 5-4.2s4.4 1.4 5 4.2 M13 4.3a3 3 0 010 5.4M15 12.6c1.4.6 2.2 1.9 2.5 3.9'],
    mas: ['Más', 'Mas.dc.html', 'M10 10.8a.8.8 0 100-1.6.8.8 0 000 1.6zM4.5 10.8a.8.8 0 100-1.6.8.8 0 000 1.6zM15.5 10.8a.8.8 0 100-1.6.8.8 0 000 1.6z'],
  };
  ROLES = { admin: ['hoy', 'pase', 'embudo', 'tareas', 'mas'], maestro: ['hoy', 'pase', 'alumnos'], recepcion: ['pase', 'pagos', 'cuenta', 'uniformes', 'mas'], asesor: ['hoy', 'embudo', 'tareas', 'cuenta', 'mas'] };
  renderVals() {
    const ids = this.ROLES[this.props.rol] || this.ROLES.admin, activa = this.props.activa || '';
    const enBarra = ids.includes(activa);
    return { items: ids.map((id) => { const a = id === activa || (!enBarra && id === 'mas'), [nombre, href, d] = this.S[id]; return { nombre, href, d, actual: a ? 'page' : undefined, tinta: a ? '#3A32D1' : '#454B60', peso: a ? 700 : 600 }; }) };
  }
}
</script>
</body>
</html>
