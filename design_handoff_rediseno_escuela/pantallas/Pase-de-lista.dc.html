<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F3F4F8}
*,*::before,*::after{box-sizing:border-box}
a{color:#2B2699;text-decoration:none}a:hover{color:#171A2C}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid #3A32D1;outline-offset:2px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div ref="{{ raiz }}" style="position: relative; height: 100vh; max-height: 100%; display: flex; flex-direction: {{ direccion }}; overflow: hidden; background: #F3F4F8; color: #171A2C; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<sc-if value="{{ escritorio }}" hint-placeholder-val="{{ true }}"><dc-import name="Lateral" activa="pase" hint-size="232px,100%" style="flex: 0 0 232px; height: 100%"></dc-import></sc-if>
<div style="flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column">
<sc-if value="{{ movil }}"><dc-import name="Cabecera" texto="Academia Nova · Águilas" iniciales="MD" nombre="Marco Díaz" hint-size="100%,60px"></dc-import></sc-if>
<main style="flex: 1 1 auto; min-height: 0; overflow: auto; padding: {{ relleno }}; display: flex; flex-direction: column; gap: 16px">
<div style="flex: none; width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 38px; letter-spacing: -0.015em">Pase de lista</h1>
<div style="color: #5A6074">Un toque por alumno. Se guarda una sola vez al final.</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="grupo" style="font-size: 12.5px; line-height: 16px; font-weight: 600; color: #5A6074">Grupo</label><select id="grupo" style="min-height: 48px; padding: 0 12px; background: #FFFFFF; color: #171A2C; border: 1px solid #8E95AA; border-radius: 12px; font-size: 15px; font-weight: 600"><option>Karate Infantil 3-5 · Lun y Mié 4:00 pm</option><option>Karate Infantil 6-8 · Lun y Mié 5:00 pm</option><option>Karate Infantil 9-12 · Lun y Mié 6:30 pm</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fecha" style="font-size: 12.5px; line-height: 16px; font-weight: 600; color: #5A6074">Fecha</label><select id="fecha" style="min-height: 48px; padding: 0 12px; background: #FFFFFF; color: #171A2C; border: 1px solid #8E95AA; border-radius: 12px; font-size: 15px; font-weight: 600"><option>Hoy, lunes 12 de octubre</option><option>Miércoles 7 de octubre</option><option>Lunes 5 de octubre</option></select></div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DEE1EA; border-radius: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px">
<sc-for list="{{ conteo }}" as="c" hint-placeholder-count="4"><span style="display: inline-flex; align-items: baseline; gap: 6px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; line-height: 26px; color: {{ c.tinta }}; font-variant-numeric: tabular-nums">{{ c.valor }}</span><span style="color: #454B60; font-weight: 600">{{ c.nombre }}</span></span></sc-for>
</div>
<button type="button" onClick="{{ alTodos }}" style="min-height: 44px; padding: 0 16px; background: #ECEBFC; color: #2B2699; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer">Marcar a todos presentes</button>
</div>

<sc-if value="{{ guardado }}">
<div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: #E1F3E7; border: 1px solid #17603A; border-radius: 12px; color: #17603A; font-weight: 600; animation: aparece 180ms cubic-bezier(.2,.8,.2,1)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M4.5 10.5l3.5 3.5 7.5-8"></path></svg>{{ textoGuardado }}</div>
</sc-if>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ alumnos }}" as="a" hint-placeholder-count="6">
<li style="background: #FFFFFF; border-radius: 14px; padding: 12px 12px 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; box-shadow: 0 1px 2px rgba(23,26,44,0.08), 0 2px 6px -2px rgba(23,26,44,0.10)">
<div style="flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: oklch(0.95 0.035 35); color: oklch(0.44 0.13 35); font-size: 13px; font-weight: 700">{{ a.iniciales }}</span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 16px; line-height: 22px">{{ a.nombre }}</span>
<sc-if value="{{ a.hayNota }}"><span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 6px; background: {{ a.fondoNota }}; color: {{ a.tintaNota }}; border: {{ a.bordeNota }}; font-size: 12px; line-height: 16px; font-weight: 700">{{ a.nota }}</span></sc-if>
</div>
</div>
<div role="radiogroup" aria-label="{{ a.etiqueta }}" style="flex: 1 1 300px; display: flex; gap: 6px">
<sc-for list="{{ a.opciones }}" as="o" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ o.activa }}" onClick="{{ o.alElegir }}" style="flex: 1 1 0; min-height: 48px; padding: 0 6px; background: {{ o.fondo }}; color: {{ o.tinta }}; border: {{ o.borde }}; border-radius: 12px; font-weight: 700; cursor: pointer; transition: background-color 120ms, color 120ms">{{ o.nombre }}</button>
</sc-for>
</div>
</li>
</sc-for>
</ul>
</div>
</main>
<div style="flex: none; padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #DEE1EA; display: flex; justify-content: center">
<div style="width: 100%; max-width: 760px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="color: {{ tintaPendiente }}; font-weight: 600">{{ pendienteTexto }}</span>
<button type="button" disabled="{{ bloqueado }}" onClick="{{ alGuardar }}" style="min-height: 52px; padding: 0 22px; background: {{ fondoBoton }}; color: {{ tintaBoton }}; border: 1px solid {{ fondoBoton }}; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer">Guardar pase de lista</button>
</div>
</div>
<sc-if value="{{ movil }}"><dc-import name="Barra" rol="maestro" activa="pase" hint-size="100%,72px"></dc-import></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  raiz = React.createRef();
  NOMBRES = ['Bruno Salas', 'Camila Ibarra', 'Daniel Ponce', 'Emma Rivas', 'Iker Montoya', 'Leo Castañeda', 'Lucas Fierro', 'Mía Ortega', 'Renata Sosa', 'Santino Vivanco', 'Thiago Reyes', 'Valeria Treviño', 'Ximena Duarte'];
  OPC = [['presente', 'Presente', '#E1F3E7', '#17603A', '#17603A'], ['falta', 'Falta', '#FDECEA', '#B3261E', '#B3261E'], ['justificada', 'Justificada', '#ECEBFC', '#2B2699', '#3A32D1']];
  state = { movil: false, marcas: {}, guardado: null };
  componentDidMount() { const el = this.raiz.current; if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => this.medir()); this.ro.observe(el); } this.medir(); }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  medir() { const el = this.raiz.current; if (!el) return; const movil = el.offsetWidth < 900; if (movil !== this.state.movil) this.setState({ movil }); }
  renderVals() {
    const s = this.state, movil = s.movil, m = s.marcas, total = this.NOMBRES.length;
    const cuenta = (k) => Object.values(m).filter((v) => v === k).length, faltan = total - Object.keys(m).length;
    const alumnos = this.NOMBRES.map((nombre) => { const p = nombre.split(' '), v = m[nombre], santino = nombre === 'Santino Vivanco';
      return { nombre, iniciales: p[0][0] + p[1][0], etiqueta: `Asistencia de ${nombre}`, hayNota: santino, nota: '3 faltas seguidas', fondoNota: '#FFF0D2', tintaNota: '#6B4100', bordeNota: '1px solid #F0C56A',
        opciones: this.OPC.map(([id, n, fondo, tinta, borde]) => { const a = v === id; return { nombre: n, activa: a, fondo: a ? fondo : '#FFFFFF', tinta: a ? tinta : '#454B60', borde: a ? `2px solid ${borde}` : '1px solid #C5CAD8', alElegir: () => this.setState((st) => ({ marcas: { ...st.marcas, [nombre]: id }, guardado: null })) }; }) }; });
    alumnos.splice(6, 0, { nombre: 'Matías Zepeda', iniciales: 'MZ', etiqueta: 'Asistencia de Matías Zepeda', hayNota: true, nota: 'Clase muestra · se marca en «Hoy»', fondoNota: '#ECEBFC', tintaNota: '#2B2699', bordeNota: '0', opciones: [] });
    const puede = faltan === 0;
    return {
      raiz: this.raiz, escritorio: !movil, movil, direccion: movil ? 'column' : 'row', relleno: movil ? '8px 16px 20px' : '28px 32px 24px',
      conteo: [['Presentes', cuenta('presente'), '#17603A'], ['Faltas', cuenta('falta'), '#B3261E'], ['Justificadas', cuenta('justificada'), '#2B2699'], ['Sin marcar', faltan, '#171A2C']].map(([nombre, valor, tinta]) => ({ nombre, valor, tinta })),
      alumnos, alTodos: () => this.setState({ marcas: Object.fromEntries(this.NOMBRES.map((n) => [n, 'presente'])), guardado: null }),
      guardado: !!s.guardado, textoGuardado: s.guardado || '',
      pendienteTexto: puede ? `${total} de ${total} marcados` : `Faltan ${faltan} por marcar`, tintaPendiente: puede ? '#17603A' : '#5A6074',
      bloqueado: !puede, fondoBoton: puede ? '#3A32D1' : '#F3F4F8', tintaBoton: puede ? '#FFFFFF' : '#6B7085',
      alGuardar: () => puede && this.setState({ guardado: `Pase de lista guardado: ${cuenta('presente')} presentes, ${cuenta('falta')} ${cuenta('falta') === 1 ? 'falta' : 'faltas'} y ${cuenta('justificada')} ${cuenta('justificada') === 1 ? 'justificada' : 'justificadas'}. Guardarlo otra vez no duplica nada.` }),
    };
  }
}
</script>
</body>
</html>
