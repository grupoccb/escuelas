<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio de sesión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2699}a:hover{color:#171A2C}

</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F3F4F8; color: #171A2C; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 22px">

<div style="flex: 1 1 420px; box-sizing: border-box; background: #171A2C; color: #FFFFFF; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
<div style="display: flex; align-items: center; gap: 14px">
<div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 14px; background: {{acento}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">ED</div>
<div style="font-weight: 700; font-size: 18px">Escuela demo</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 440px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; line-height: 48px; letter-spacing: -0.02em">Cada familia, de su primer mensaje a su primera clase.</div>
<div style="color: #C9CDE0; font-size: 17px; line-height: 26px">Leads, clases muestra, inscripciones y cobros en un solo lugar.</div>
</div>
<div style="color: #A9AEC6; font-size: 13px; line-height: 18px">Sucursales Águilas y Centenario</div>
</div>

<div style="flex: 999 1 420px; min-width: 0; box-sizing: border-box; padding: 48px 32px; display: flex; align-items: center; justify-content: center">
<form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 38px; letter-spacing: -0.01em">Inicia sesión</h1>
<div style="color: #5A6074">Entra con el correo que te dio tu escuela.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="correo" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #454B60">Correo</label>
<input id="correo" type="email" value="asesor@demo.test" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; background: #FFFFFF; color: #171A2C; border: 1px solid #8E95AA; border-radius: 12px; font: inherit">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="contrasena" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #454B60">Contraseña</label>
<div style="display: flex; align-items: center; box-sizing: border-box; min-height: 48px; padding: 0 4px 0 14px; background: #FFFFFF; border: 1px solid #8E95AA; border-radius: 12px">
<input id="contrasena" type="password" value="contrasena-demo" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: #171A2C">
<button type="button" style="min-height: 40px; padding: 0 12px; background: transparent; color: #2B2699; border: 0; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Mostrar</button>
</div>
</div>

<a href="#" style="font-weight: 600; font-size: 14px">Tengo un código de escuela</a>

<button type="submit" style="min-height: 52px; padding: 0 20px; background: {{acento}}; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Entrar</button>

<div style="text-align: center; color: #5A6074; font-size: 14px">¿No puedes entrar? <a href="#" style="font-weight: 600">Te decimos qué hacer</a></div>
</form>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#3A32D1","options":["#3A32D1","#0E6B5C","#B4232A","#1F5FBF"]},"$preview":{"width":1280,"height":844}}'>

return { acento: this.props.acento ?? '#3A32D1' };
}
}
</script>
</body>
</html>
